<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Music - Audio Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .back-btn { position: absolute; top: 20px; left: 20px; color: #00e676; text-decoration: none; font-weight: bold; background: #1e1e1e; padding: 10px 15px; border-radius: 5px; transition: 0.2s; }
        .back-btn:hover { background: #00e676; color: #000; }

        /* Retro Player UI */
        .player-card { background: #1e1e1e; width: 100%; max-width: 420px; padding: 30px; border-radius: 15px; border: 2px solid #00e676; text-align: center; box-shadow: 0 10px 30px rgba(0, 230, 118, 0.2); }
        .radio-screen { background: #000; border: 1px solid #333; padding: 25px; border-radius: 10px; margin-bottom: 20px; }
        .category-badge { display: inline-block; background: #00e676; color: #000; font-size: 0.8rem; font-weight: bold; padding: 3px 12px; border-radius: 12px; margin-bottom: 12px; text-transform: uppercase; }
        .song-title { font-size: 1.3rem; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .song-artist { font-size: 0.9rem; color: #888; }
        
        /* Hidden YouTube Video Container */
        #hidden-youtube-player { width: 1px; height: 1px; opacity: 0; position: absolute; left: -9999px; }

        /* Controls */
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 20px; }
        .btn { background: #333; color: #fff; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #00e676; color: #000; }
        .play-btn { width: 65px; height: 65px; font-size: 1.5rem; background: #00e676; color: #000; }
        
        /* Playlist View */
        .playlist { margin-top: 25px; text-align: left; background: #151515; padding: 10px; border-radius: 8px; max-height: 160px; overflow-y: auto; }
        .track-item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.9rem; color: #ccc; }
        .track-item:hover, .track-item.active { color: #00e676; font-weight: bold; background: #1f1f1f; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">⬅ Home</a>

    <!-- Hidden YouTube Player -->
    <div id="hidden-youtube-player"></div>

    <div class="player-card">
        <div class="radio-screen">
            <span class="category-badge" id="catDisplay">Flow Station</span>
            <div class="song-title" id="titleDisplay">Loading Track...</div>
            <div class="song-artist" id="artistDisplay">Flow Music</div>
        </div>

        <div class="controls">
            <button class="btn" onclick="prevSong()">⏮</button>
            <button class="btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextSong()">⏭</button>
        </div>

        <div class="playlist" id="playlistContainer"></div>
    </div>

    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const songsData = {
            "2000s": [
                { title: "Dil Laga Liya Maine", artist: "Dil Hai Tumhaara", ytId: "x0-HqX3cT_Y" },
                { title: "Tere Naam Title Track", artist: "Tere Naam", ytId: "3x_4p-8-Cg8" }
            ],
            "90s": [
                { title: "Tujhe Dekha To", artist: "DDLJ", ytId: "c25G1eR3Nvg" },
                { title: "Pehla Nasha", artist: "Jo Jeeta Wohi Sikandar", ytId: "8x8_N22sXgE" }
            ],
            "lofi": [
                { title: "Bollywood Lofi Chill", artist: "Retro Lo-Fi", ytId: "bQ1b8Pz4p_M" }
            ],
            "instrumental": [
                { title: "Flute Retro Medley", artist: "Instrumental Station", ytId: "4_aK4K_Zz8k" }
            ]
        };

        const urlParams = new URLSearchParams(window.location.search);
        let currentCat = urlParams.get('cat') || '2000s';
        if (!songsData[currentCat]) currentCat = '2000s';

        let currentPlaylist = songsData[currentCat];
        let currentIndex = 0;
        let ytPlayer;
        let isPlaying = false;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('hidden-youtube-player', {
                height: '0',
                width: '0',
                videoId: currentPlaylist[currentIndex].ytId,
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady() {
            loadPlaylistUI();
            updateSongInfo();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                nextSong();
            }
        }

        function loadPlaylistUI() {
            document.getElementById('catDisplay').innerText = currentCat + " Station";
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';

            currentPlaylist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `track-item ${index === currentIndex ? 'active' : ''}`;
                item.innerText = `${index + 1}. ${song.title} - ${song.artist}`;
                item.onclick = () => playSongAtIndex(index);
                container.appendChild(item);
            });
        }

        function updateSongInfo() {
            const song = currentPlaylist[currentIndex];
            document.getElementById('titleDisplay').innerText = song.title;
            document.getElementById('artistDisplay').innerText = song.artist;
            loadPlaylistUI();
        }

        function togglePlay() {
            if (!ytPlayer) return;
            if (isPlaying) {
                ytPlayer.pauseVideo();
                document.getElementById('playBtn').innerText = '▶';
                isPlaying = false;
            } else {
                ytPlayer.playVideo();
                document.getElementById('playBtn').innerText = '⏸';
                isPlaying = true;
            }
        }

        function playSongAtIndex(index) {
            currentIndex = index;
            updateSongInfo();
            ytPlayer.loadVideoById(currentPlaylist[currentIndex].ytId);
            ytPlayer.playVideo();
            document.getElementById('playBtn').innerText = '⏸';
            isPlaying = true;
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            playSongAtIndex(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playSongAtIndex(currentIndex);
        }
    </script>
</body>
</html>
